name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-benchmark:
    name: Run Unit Tests & Routing Benchmark
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Validate Python Syntax
        run: |
          python -m compileall app/ scripts/ tests/

      - name: Execute Pytest Suite with Coverage
        env:
          REDIS_URL: "redis://localhost:6379/0"
        run: |
          pytest tests/ -v

      - name: Run 50-Query Semantic Routing Benchmark
        run: |
          python scripts/benchmark.py

  docker-build:
    name: Build & Validate Production Container
    runs-on: ubuntu-latest
    needs: test-and-benchmark

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: enterprise-mcp-agent-router:latest
